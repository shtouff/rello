services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]

  rello:
    build: .
    ports:
      - "8000:8000"
    environment:
      RELLO_REDIS_HOST: redis
      RELLO_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
